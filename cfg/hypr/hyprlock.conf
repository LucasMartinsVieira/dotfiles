# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Monospace

general {
    hide_cursor = true
}

# Uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    color = rgba(08080899)
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3

    # Moonfly failure gradient
    fail_color = rgba(ff5454ee) rgba(ff5189ee) 40deg

    # Moonfly colors
    inner_color = rgb(8, 8, 8)          # #080808
    outer_color = rgb(116, 178, 255)    # #74b2ff
    font_color  = rgb(189, 189, 189)    # #bdbdbd
    check_color = rgb(140, 200, 95)     # #8cc85f

    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(189, 189, 189)

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgb(116, 178, 255)

    position = -30, -150
    halign = right
    valign = top
}

# Keyboard Layout
label {
    monitor =
    text = $LAYOUT[en,br]
    font_size = 24
    font_family = $font
    color = rgb(140, 200, 95)

    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
